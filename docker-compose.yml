services:
  postgres:
    image: postgres:17-alpine
    container_name: staybook_postgres
    environment:
      POSTGRES_DB: staybook_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d staybook_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: staybook_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: staybook_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Dashboard UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: staybook_seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"       # Seq Web UI / Ingestion
    volumes:
      - seq_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  seq_data:
